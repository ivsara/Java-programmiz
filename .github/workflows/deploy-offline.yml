name: Build Offline APK & Deploy Offline GitHub Pages App

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Decode Debug Keystore if Needed
        run: |
          if [ ! -f debug.keystore ] && [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Offline Android APK
        run: gradle assembleDebug

      - name: Copy APK into GitHub Pages Offline Bundle
        run: |
          mkdir -p docs/downloads
          cp app/build/outputs/apk/debug/app-debug.apk docs/downloads/UniversalJavaStudio-Offline.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UniversalJavaStudio-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages Bundle (Offline PWA + APK)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
